name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Install quality tools
        run: |
          uv pip install --system --no-config \
            --default-index https://pypi.org/simple \
            --only-binary :all: --require-hashes \
            --requirement requirements-dev.lock
      - name: Static checks
        run: |
          git diff --check
          ruff check .
          ruff format --check .
          bandit -q -c pyproject.toml -r app packaging runtime_guard scripts workers
          python -m compileall -q app packaging runtime_guard scripts tests workers
          python -m unittest discover -s tests -p "test_*.py"
          find scripts packaging -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n
          bash -n install.sh start.sh packaging/AppRun
          node --check static/app.js
          test -z "$(git ls-files models .venv .venv-ocr .venv-tts bin data outputs)"
          private_marker='-----BEGIN '"(RSA |EC |OPENSSH )?PRIVATE KEY-----"
          github_fine_grained='github'_'pat_[[:alnum:]_]{20,}'
          github_classic='ghp'_'[[:alnum:]]{20,}'
          aws_access_key='AKIA''[[:alnum:]]{16}'
          google_api_key='AIza''[[:alnum:]_-]{20,}'
          slack_token='xox''[baprs]-[[:alnum:]-]{10,}'
          secret_pattern="${private_marker}|${github_fine_grained}|${github_classic}|${aws_access_key}|${google_api_key}|${slack_token}"
          test -z "$(git grep -IlE -- "$secret_pattern" -- . || true)"
          python scripts/check_portability.py

  core-smoke:
    name: Core smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            venv-python: .venv/bin/python
          - os: macos-14
            venv-python: .venv/bin/python
          - os: windows-latest
            venv-python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Install and run smoke test
        shell: bash
        env:
          VENV_PYTHON: ${{ matrix.venv-python }}
        run: |
          python scripts/bootstrap.py --core-only --skip-desktop --dry-run
          python scripts/bootstrap.py --core-only --skip-desktop
          "$VENV_PYTHON" tests/smoke_local.py
      - name: Parse PowerShell launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("install.ps1", "start.ps1", "packaging/build_windows.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              "$PWD\$file", [ref]$null, [ref]$errors
            ) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }

  full-local-pipeline:
    name: Full local OCR and speech pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Install OCR and Kokoro, then exercise the complete workflow
        shell: bash
        run: |
          python scripts/bootstrap.py --skip-desktop
          .venv/bin/python tests/smoke_local.py --full
