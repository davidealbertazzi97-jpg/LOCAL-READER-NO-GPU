name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: >-
          python -m pip install --disable-pip-version-check
          ruff==0.16.0 bandit==1.9.4
      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
          bandit -q -c pyproject.toml -r app runtime_guard scripts
          python -m compileall -q app runtime_guard scripts tests
          python -m unittest discover -s tests -p "test_*.py"
          find scripts -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n
          bash -n install.sh start.sh
          node --check static/app.js

  core-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            venv-python: .venv/bin/python
          - os: macos-14
            venv-python: .venv/bin/python
          - os: windows-latest
            venv-python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Install and run smoke test
        shell: bash
        run: |
          python scripts/bootstrap.py --dry-run
          python scripts/bootstrap.py
          "${{ matrix.venv-python }}" tests/smoke_local.py
      - name: Parse PowerShell launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("install.ps1", "start.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              "$PWD\$file", [ref]$null, [ref]$errors
            ) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
