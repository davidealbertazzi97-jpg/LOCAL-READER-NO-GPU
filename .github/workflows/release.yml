name: Build release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-appimage
          - os: windows-latest
            artifact: windows-exe
          - os: macos-14
            artifact: macos-app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Install AppImage tooling
        if: runner.os == 'Linux'
        run: |
          python packaging/install_appimage_tools.py
      - name: Build package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            ./packaging/build_appimage.sh
          elif [ "$RUNNER_OS" = macOS ]; then
            ./packaging/build_macos.sh
          else
            pwsh -File packaging/build_windows.ps1
          fi
      - name: Test native first-run install, OCR and offline speech
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            python packaging/test_native_package.py dist/*.AppImage
          elif [ "$RUNNER_OS" = macOS ]; then
            python packaging/test_native_package.py dist/*.app/Contents/MacOS/"Local Reader No GPU"
          else
            python packaging/test_native_package.py dist/*.exe
          fi
          python -c 'import os,shutil; shutil.make_archive("dist/Installed-dependency-notices-"+os.environ["RUNNER_OS"],"zip","build/installed-licenses")'
      - name: Include source and third-party corresponding source
        if: runner.os == 'Linux'
        run: |
          python packaging/create_payload.py --output dist/Local-Reader-No-GPU-source.zip
          python packaging/collect_sources.py
      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish native packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./* --verify-tag \
            --title "Local Reader No GPU $RELEASE_TAG" --notes-file "../docs/releases/$RELEASE_TAG.md"
